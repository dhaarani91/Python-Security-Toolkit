---
- name: Remediate CIS violations
  hosts: vms
  become: true
  tasks:
    - name: Fix - Disable SSH root login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: Restart ssh

    - name: Fix - Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: Restart ssh

    - name: Fix - Disable SSH password authentication in cloud-init drop-in
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config.d/50-cloud-init.conf
        regexp: '^PasswordAuthentication'
        line: 'PasswordAuthentication no'
        create: false
      notify: Restart ssh
      ignore_errors: true

    - name: Fix - Set SSH MaxAuthTries to 4
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 4'
      notify: Restart ssh

    - name: Fix - Disable SSH X11 forwarding
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?X11Forwarding'
        line: 'X11Forwarding no'
      notify: Restart ssh

    - name: Fix - Set SSH ClientAliveInterval
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?ClientAliveInterval'
        line: 'ClientAliveInterval 300'
      notify: Restart ssh

    - name: Fix - Allow SSH before enabling firewall
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Fix - Enable UFW firewall
      community.general.ufw:
        state: enabled

    - name: Fix - Enable unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started

    - name: Fix - Set password max age
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MAX_DAYS'
        line: 'PASS_MAX_DAYS   90'
    - name: Fix - Set SSH LoginGraceTime
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?LoginGraceTime'
        line: 'LoginGraceTime 60'
      notify: Restart ssh

    - name: Fix - Set SSH LogLevel
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?LogLevel'
        line: 'LogLevel INFO'
      notify: Restart ssh

    - name: Fix - Set /etc/passwd permissions
      ansible.builtin.file:
        path: /etc/passwd
        mode: '0644'

    - name: Fix - Set /etc/shadow permissions
      ansible.builtin.file:
        path: /etc/shadow
        mode: '0640'

    - name: Fix - Restrict core dumps (suid_dumpable)
      ansible.posix.sysctl:
        name: fs.suid_dumpable
        value: '0'
        state: present
        reload: true
    - name: Fix - Disable PermitEmptyPasswords
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords no'
      notify: Restart ssh

    - name: Fix - Enable IgnoreRhosts
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?IgnoreRhosts'
        line: 'IgnoreRhosts yes'
      notify: Restart ssh

  handlers:
    - name: Restart ssh
      ansible.builtin.systemd:
        name: ssh
        state: restarted

